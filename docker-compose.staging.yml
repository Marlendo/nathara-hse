# HSE STAGING runtime (PM-HSE-0001 Fase 4 + Fase B shared PG 2026-11-23) —
# dipakai dengan:
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
#
# Fase B (OVERRIDE human "saya yakin"): web → cluster SHARED
# `staging-postgres-18:5432/hse` via network external `staging-shared`
# (pola Safe Campus 4c98a2f). Service `postgres` lokal DIHAPUS dari file ini
# (container+volume lama hse-postgres:5434 SENGAJA tidak dikelola lagi di sini
# dan DIBIARKAN Up sebagai jalan mundur — JANGAN down -v).
#
# Beda dari docker-compose.yml (dev/upstream):
# - container beaconhs-* → hse-* (rebrand operator, SA-HSE FINAL)
# - minio host ports 9100/9101 (9000 dipakai portainer di mesin ini)
# - web: image dari Dockerfile repo (build terpisah), gabung siakad-network
#   agar nginx staging bisa proxy smk3.nathara.ac.id → http://hse-web:3000
# Scope dikunci: JANGAN pruning service; JANGAN ubah docker-compose.yml dev.
name: hse-staging

services:
  # JALAN MUNDUR Fase A: cluster lokal hse-postgres:5434 (container + volume
  # hse-postgres-data) tetap HIDUP di luar file ini. Jangan definisikan ulang
  # di sini agar `up/down` compose tidak pernah menyentuhnya.

  redis:
    image: redis:7-alpine
    container_name: hse-redis
    ports:
      - '6380:6379'
    volumes:
      - hse-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hse-staging

  minio:
    image: minio/minio:latest
    container_name: hse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HSE_MINIO_ROOT_USER:?wajib}
      MINIO_ROOT_PASSWORD: ${HSE_MINIO_ROOT_PASSWORD:?wajib}
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - hse-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hse-staging

  mailpit:
    image: axllent/mailpit:latest
    container_name: hse-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - hse-staging

  # In-browser PowerPoint editor (sama seperti dev; WOPI callback + framing
  # diselaraskan ke APP_URL saat web staging hijau — Fase 4 verifikasi login).
  collabora:
    image: collabora/code:latest
    container_name: hse-collabora
    environment:
      - aliasgroup1=http://host.docker.internal:3000
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:net.frame_ancestors=http://localhost:3000 --o:welcome.enable=false --o:home_mode.enable=true --o:storage.wopi.max_file_size=1073741824
    ports:
      - '9980:9980'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./deploy/collabora-branding.js:/usr/share/coolwsd/browser/dist/branding.js:ro
    networks:
      - hse-staging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_VERSION: ${HSE_DEPLOYMENT_SHA:?set HSE_DEPLOYMENT_SHA=git rev-parse HEAD}
      secrets:
        - next_server_actions_key
    image: hse-web:staging
    container_name: hse-web
    environment:
      APP_ROLE: web
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      APP_VERSION: ${APP_VERSION:-staging}
      # Fase B: DB = cluster SHARED staging-postgres-18 (DB hse).
      # Password HSE_SHARED_* disalin runtime dari /home/marlendo/staging/docker/.env.
      DATABASE_URL: postgresql://beaconhs_app:${HSE_SHARED_DB_APP_PASSWORD:?wajib}@staging-postgres-18:5432/hse
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:${HSE_SHARED_DB_SUPER_PASSWORD:?wajib}@staging-postgres-18:5432/hse
      REDIS_URL: ${HSE_RUNTIME_REDIS_URL:?wajib}
      HSE_APP_SECRET: ${HSE_APP_SECRET:?wajib}
      HSE_INVITE_SECRET: ${HSE_INVITE_SECRET:?wajib}
      ATTACHMENT_CAPABILITY_SECRET: ${ATTACHMENT_CAPABILITY_SECRET:?wajib}
      APP_URL: ${APP_URL:?wajib}
      SUPABASE_URL: ${SUPABASE_URL:-https://api.nathara.ac.id}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?wajib — minta ke PM/human, jangan karang}
      COLLABORA_URL: ${COLLABORA_URL:-}
      COLLABORA_WOPI_URL: ${COLLABORA_WOPI_URL:-}
    networks:
      - hse-staging
      - siakad-network
      - staging-shared
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/api/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  hse-staging:
  siakad-network:
    external: true
  staging-shared:
    external: true

secrets:
  next_server_actions_key:
    file: ./secrets/next_server_actions_key

volumes:
  hse-postgres-data:
    name: hse-postgres-data
  hse-redis-data:
    name: hse-redis-data
  hse-minio-data:
    name: hse-minio-data
